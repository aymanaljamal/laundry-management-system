services:
  mysql:
    image: mysql:8.0
    container_name: laundry-mysql
    environment:
      MYSQL_DATABASE: laundry
      MYSQL_USER: laundry_user
      MYSQL_PASSWORD: laundry_password
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: